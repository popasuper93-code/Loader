name: Build Loader APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      # 1. Наш репозиторий (папка app/ + этот workflow)
      - name: Checkout loader
        uses: actions/checkout@v4
        with:
          path: loader

      # 2. Движок BlackBox (модули Bcore, black-reflection, compiler)
      - name: Clone BlackBox engine
        run: |
          git clone https://github.com/ALEX5402/NewBlackbox.git engine
          git -C engine checkout 7956ec36 || echo "Pinned commit not found, using latest"

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Android SDK / NDK
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-35" "build-tools;35.0.0" "ndk;29.0.13846066"

      # 3. Заменяем app-модуль движка на наш
      - name: Replace app module
        run: |
          rm -rf engine/app
          cp -r loader/app engine/app

      # 4. Диагностика: показываем сигнатуры API, с которыми компилируемся
      - name: Print BlackBox API (debug)
        run: |
          CORE=engine/Bcore/src/main/java/top/niunaijun/blackbox
          grep -n "installPackageAsUser\|launchApk\|addAppLifecycleCallback\|doAttachBaseContext" $CORE/BlackBoxCore.java || true
          echo "----- AppLifecycleCallback -----"
          cat $CORE/app/configuration/AppLifecycleCallback.java || true
          echo "----- InstallResult -----"
          cat $CORE/entity/pm/InstallResult.java || true
          echo "----- libs in app -----"
          find engine/app/src/main/jniLibs -type f 2>/dev/null || echo "jniLibs: пусто (плагин не добавлен)"

      - name: Build debug APK
        working-directory: engine
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: loader-apk
          path: engine/app/build/outputs/apk/debug/*.apk
          
