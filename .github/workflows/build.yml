name: Build Loader APK

# Сборка запускается автоматически при каждом коммите в main/master
# и вручную (Actions -> Build Loader APK -> Run workflow).
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      # 1. Наш репозиторий (папка app/ + этот workflow)
      - name: Checkout loader
        uses: actions/checkout@v4
        with:
          path: loader

      # 2. Движок BlackBox (модули Bcore, black-reflection, compiler)
      - name: Clone BlackBox engine
        run: |
          git clone https://github.com/ALEX5402/NewBlackbox.git engine
          git -C engine checkout 7956ec36 || echo "Pinned commit not found, using latest"

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Android SDK / NDK
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-35" "build-tools;35.0.0" "ndk;29.0.13846066"

      # 3. Заменяем app-модуль движка на наш
      - name: Replace app module
        run: |
          rm -rf engine/app
          cp -r loader/app engine/app

      # 3.1. Иконка: если загружены не все 4 файла — собираем со стандартной иконкой,
      #      чтобы сборка не падала. Когда загрузите все файлы, иконка подхватится сама.
      - name: Check icon files
        run: |
          RES=engine/app/src/main/res
          ALL_OK=1
          for f in \
            mipmap-nodpi/ic_launcher.png \
            mipmap-anydpi-v26/ic_launcher.xml \
            drawable-nodpi/ic_launcher_fg.png \
            drawable/ic_launcher_bg.xml
          do
            if [ ! -f "$RES/$f" ]; then
              echo "::warning::Нет файла иконки: res/$f"
              ALL_OK=0
            fi
          done
          if [ "$ALL_OK" = "1" ]; then
            echo "Иконка ChadLouder: все 4 файла на месте"
          else
            echo "⚠ Иконка неполная — собираю со стандартной иконкой Android"
            rm -f "$RES/mipmap-nodpi/ic_launcher.png" \
                  "$RES/mipmap-anydpi-v26/ic_launcher.xml" \
                  "$RES/drawable-nodpi/ic_launcher_fg.png" \
                  "$RES/drawable/ic_launcher_bg.xml"
            sed -i 's#@mipmap/ic_launcher#@android:drawable/sym_def_app_icon#' \
              engine/app/src/main/AndroidManifest.xml
          fi

      # 4. Проверка, что все нужные файлы на месте
      - name: Check project files
        run: |
          echo "---- res ----"
          find engine/app/src/main/res -type f 2>/dev/null | sort || true
          echo "---- java ----"
          find engine/app/src/main/java -type f 2>/dev/null | sort || true
          echo "---- jniLibs ----"
          find engine/app/src/main/jniLibs -type f 2>/dev/null || echo "jniLibs: пусто (плагин не добавлен)"
          for f in \
            app/build.gradle \
            app/src/main/AndroidManifest.xml \
            app/src/main/java/com/loader/app/App.java \
            app/src/main/java/com/loader/app/MainActivity.java
          do
            if [ -f "engine/$f" ]; then echo "OK      $f"; else echo "::error::НЕТ ФАЙЛА: $f"; fi
          done
          echo "---- App.java: версия ----"
          grep -c "GAME_PKG" engine/app/src/main/java/com/loader/app/App.java \
            && echo "App.java НОВЫЙ (есть GAME_PKG)" \
            || echo "::error::App.java СТАРЫЙ — замените его новой версией"

      # 5. Сборка. В консоль идёт только короткий вывод (без шума про манифест),
      #    полный лог сохраняется в build.log
      - name: Build debug APK
        working-directory: engine
        run: |
          chmod +x gradlew
          set +e
          ./gradlew :app:assembleDebug --no-daemon --console=plain --warning-mode none 2>&1 \
            | tee ../build.log \
            | grep -v -E "^> Task|duplicated with element|Warning:$"
          code=${PIPESTATUS[0]}
          exit $code

      # 6. При падении — выжимка ошибок: в консоль, в Summary и в аннотации
      - name: Show build errors
        if: failure()
        run: |
          if [ -f build.log ]; then
            echo "=============== ОШИБКИ КОМПИЛЯЦИИ JAVA ==============="
            grep -E "\.java:[0-9]+: error" -A 2 build.log | head -60 || true
            echo "=============== GRADLE: ЧТО ПОШЛО НЕ ТАК ==============="
            sed -n '/What went wrong/,/\* Try:/p' build.log | head -40
            {
              echo "## Ошибки сборки"
              echo '```'
              grep -E "\.java:[0-9]+: error" -A 2 build.log | head -60 || true
              sed -n '/What went wrong/,/\* Try:/p' build.log | head -40
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: loader-apk
          path: engine/app/build/outputs/apk/debug/*.apk
          
