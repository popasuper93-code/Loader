name: Build Loader APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      # 1. Наш репозиторий (папка app/ + этот workflow)
      - name: Checkout loader
        uses: actions/checkout@v4
        with:
          path: loader

      # 2. Движок BlackBox (модули Bcore, black-reflection, compiler)
      - name: Clone BlackBox engine
        run: |
          git clone https://github.com/ALEX5402/NewBlackbox.git engine
          git -C engine checkout 7956ec36 || echo "Pinned commit not found, using latest"

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Android SDK / NDK
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-35" "build-tools;35.0.0" "ndk;29.0.13846066"

      # 3. Заменяем app-модуль движка на наш
      - name: Replace app module
        run: |
          rm -rf engine/app
          cp -r loader/app engine/app

      # 4. Проверка, что все нужные файлы на месте
      - name: Check project files
        run: |
          echo "---- res ----"
          find engine/app/src/main/res -type f 2>/dev/null | sort || true
          echo "---- java ----"
          find engine/app/src/main/java -type f 2>/dev/null | sort || true
          echo "---- jniLibs ----"
          find engine/app/src/main/jniLibs -type f 2>/dev/null || echo "jniLibs: пусто (плагин не добавлен)"
          for f in \
            app/build.gradle \
            app/src/main/AndroidManifest.xml \
            app/src/main/java/com/loader/app/App.java \
            app/src/main/java/com/loader/app/MainActivity.java \
            app/src/main/res/mipmap-nodpi/ic_launcher.png \
            app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml \
            app/src/main/res/drawable-nodpi/ic_launcher_fg.png \
            app/src/main/res/drawable/ic_launcher_bg.xml
          do
            if [ -f "engine/$f" ]; then echo "OK      $f"; else echo "::error::НЕТ ФАЙЛА: $f"; fi
          done

      # 5. Сборка (весь вывод сохраняем в build.log)
      - name: Build debug APK
        working-directory: engine
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew :app:assembleDebug --no-daemon --stacktrace 2>&1 | tee ../build.log

      # 6. При падении — выжимка ошибок на странице запуска (Summary) и в аннотациях
      - name: Show build errors
        if: failure()
        run: |
          if [ -f build.log ]; then
            {
              echo "## Ошибки сборки"
              echo '```'
              echo "--- Java-ошибки ---"
              grep -E "\.java:[0-9]+: error" -A 3 build.log | head -60 || true
              echo "--- Gradle: что пошло не так ---"
              sed -n '/FAILURE: Build failed/,/\* Try:/p' build.log | head -60
              echo "--- Ресурсы / манифест ---"
              grep -i -E "AAPT|Manifest merger|resource .* not found|error: " build.log | head -30 || true
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            sed -n '/What went wrong/,/\* Try:/p' build.log | head -12 | while IFS= read -r line; do
              echo "::error::$line"
            done
            grep -E "\.java:[0-9]+: error" build.log | head -10 | while IFS= read -r line; do
              echo "::error::$line"
            done
          fi

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: loader-apk
          path: engine/app/build/outputs/apk/debug/*.apk
          
